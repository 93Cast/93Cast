name: Update GitHub Stats

on:
  schedule:
    # Actualiza las estadísticas todos los días a las 3:00 AM UTC
    - cron: "0 3 * * *"

  # Permite ejecutar el workflow manualmente
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # Descargar el contenido del repositorio
      - name: Checkout repository
        uses: actions/checkout@v6

      # Crear carpeta para las estadísticas
      - name: Create profile directory
        run: mkdir -p profile

      # Generar tarjeta de estadísticas
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generar tarjeta de lenguajes
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Guardar los archivos generados
      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub statistics"

          git push
